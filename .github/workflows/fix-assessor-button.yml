name: Fix assessor add button

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch assessor editor
        shell: python
        run: |
          from pathlib import Path
          p = Path("app/portal/page.js")
          s = p.read_text(encoding="utf-8")
          if "assessorEditorOpen" not in s:
              s = s.replace(
                  '[assessorForm, setAssessorForm] = useState(EMPTY_ASSESSOR), [editingAssessor, setEditingAssessor] = useState(null);',
                  '[assessorForm, setAssessorForm] = useState(EMPTY_ASSESSOR), [editingAssessor, setEditingAssessor] = useState(null), [assessorEditorOpen, setAssessorEditorOpen] = useState(false);'
              )
              s = s.replace(
                  'const startAssessor = () => { setEditingAssessor(null); setAssessorForm(EMPTY_ASSESSOR); };',
                  'const startAssessor = () => { setEditingAssessor(null); setAssessorForm({ ...EMPTY_ASSESSOR }); setAssessorEditorOpen(true); setMsg(""); };'
              )
              s = s.replace(
                  'const editAssessor = (a) => { setEditingAssessor(a); setAssessorForm({ ...EMPTY_ASSESSOR, ...a }); };',
                  'const editAssessor = (a) => { setEditingAssessor(a); setAssessorForm({ ...EMPTY_ASSESSOR, ...a }); setAssessorEditorOpen(true); setMsg(""); };'
              )
              s = s.replace(
                  'const cancelAssessor = () => { setEditingAssessor(null); setAssessorForm(EMPTY_ASSESSOR); };',
                  'const cancelAssessor = () => { setEditingAssessor(null); setAssessorForm(EMPTY_ASSESSOR); setAssessorEditorOpen(false); };'
              )
              s = s.replace(
                  '{editingAssessor&&<AssessorForm form={assessorForm} setForm={setAssessorForm} save={saveAssessor} cancel={cancelAssessor} editing={editingAssessor}/>} {!editingAssessor&&!db.assessors.length&&',
                  '{assessorEditorOpen&&<AssessorForm form={assessorForm} setForm={setAssessorForm} save={saveAssessor} cancel={cancelAssessor} editing={editingAssessor}/>} {!assessorEditorOpen&&!db.assessors.length&&'
              )
              p.write_text(s, encoding="utf-8")
              print("patched")
          else:
              print("already patched")

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git add app/portal/page.js
          git commit -m "fix: assessor add button"
          git push
