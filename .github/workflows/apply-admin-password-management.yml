name: Apply admin leadership password management

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: node scripts/add-admin-password-management.cjs
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/portal/page.js
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'feat: allow admin to manage leadership access passwords'
            git push
          fi
