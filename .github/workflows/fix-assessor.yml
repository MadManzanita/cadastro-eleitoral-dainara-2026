name: Fix assessor editor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch assessor editor
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/portal/page.js')
          s = p.read_text(encoding='utf-8')

          old = '''  const startAssessor = () => { setEditingAssessor(null); setAssessorForm({ ...EMPTY_ASSESSOR }); setAssessorEditorOpen(true); setMsg(\"\"); };'''
          new = '''  const startAssessor = () => { setEditingAssessor(null); setAssessorForm({ ...EMPTY_ASSESSOR }); setMsg(\"\"); setAssessorEditorOpen(true); setView(\"assessors\"); };'''
          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace('''<button className=\"primary\" onClick={startAssessor}>＋ Adicionar contato</button>''', '''<button type=\"button\" className=\"primary\" onClick={() => { setMsg(\"\"); setEditingAssessor(null); setAssessorForm({ ...EMPTY_ASSESSOR }); setAssessorEditorOpen(true); setView(\"assessors\"); }}>＋ Adicionar contato</button>''', 1)

          old_expr = '''{assessorEditorOpen&&<AssessorForm form={assessorForm} setForm={setAssessorForm} save={saveAssessor} cancel={cancelAssessor} editing={editingAssessor}/>}'''
          new_expr = '''{assessorEditorOpen&&<div className=\"assessor-modal-backdrop\" role=\"dialog\" aria-modal=\"true\"><div className=\"assessor-modal\"><AssessorForm form={assessorForm} setForm={setAssessorForm} save={saveAssessor} cancel={cancelAssessor} editing={editingAssessor}/></div></div>}'''
          if old_expr in s:
              s = s.replace(old_expr, new_expr, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Add modal styles
        run: |
          cat >> app/globals.css <<'CSS'

          .assessor-modal-backdrop{position:fixed;inset:0;z-index:1000;background:rgba(54,28,42,.34);display:flex;align-items:center;justify-content:center;padding:24px}
          .assessor-modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border:1px solid #f0c8d8;border-radius:22px;box-shadow:0 24px 70px rgba(54,28,42,.2)}
          .assessor-modal .assessor-editor{margin:0;border:0;box-shadow:none}
          .assessor-modal .editor-title{position:sticky;top:0;background:#fff;z-index:2}
          CSS
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-assessor.yml
          git add app/portal/page.js app/globals.css .github/workflows/fix-assessor.yml
          git commit -m "fix: open assessor contact form as modal" || exit 0
          git push
