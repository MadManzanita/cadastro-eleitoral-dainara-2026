<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadastro Eleitoral • Coordenadora Dainara Torres</title>
<style>
:root{--bg:#fff7f9;--card:#fff;--text:#4a3a3f;--muted:#8a747b;--primary:#e8a7b8;--primary-dark:#d88fa4;--soft:#f8e5ea;--border:#efd9df;--danger:#b85c6d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--border);padding:18px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}header h1{font-size:20px;margin:0}header span{font-size:13px;color:var(--muted)}
main{max-width:1180px;margin:28px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 4px 18px #1018280a}.metric{font-size:30px;font-weight:750;margin-top:7px}.label{color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input{flex:1;min-width:220px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:650;cursor:pointer}.primary{background:var(--primary);color:white}.secondary{background:var(--soft);color:#9b5d70}.danger{background:#fff0f3;color:var(--danger)}input,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:white;font:inherit}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#10182866;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.open{display:flex}.modalbox{background:white;border-radius:18px;max-width:680px;width:100%;max-height:90vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0;font-size:20px}.close{border:0;background:#f2f4f7;border-radius:9px;width:36px;height:36px;cursor:pointer}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}table{width:100%;border-collapse:collapse}.tablewrap{overflow:auto}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--border);white-space:nowrap}th{font-size:12px;text-transform:uppercase;color:var(--muted)}td{font-size:14px}.empty{text-align:center;color:var(--muted);padding:35px}.tag{padding:5px 8px;border-radius:99px;background:var(--soft);color:#9b5d70;font-size:12px;font-weight:650}@media(max-width:760px){.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}header{padding:15px 17px}main{margin:18px auto}}
</style>
</head>
<body>
<header><div><h1>Cadastro Eleitoral</h1><span>Coordenadora Dainara Torres</span></div><button class="btn primary" onclick="openModal()">+ Nova liderança</button></header>
<main>
<section class="grid"><div class="card"><div class="label">Lideranças</div><div class="metric" id="mCoordinators">0</div></div><div class="card"><div class="label">Ativistas</div><div class="metric" id="mMembers">0</div></div><div class="card"><div class="label">Equipes</div><div class="metric" id="mTeams">0</div></div></section>
<section class="card"><div class="toolbar"><input id="search" placeholder="Pesquisar liderança ou ativista..." oninput="render()"><button class="btn secondary" onclick="exportCSV()">Exportar CSV</button><button class="btn danger" onclick="clearData()">Limpar dados locais</button></div><div class="tablewrap"><table><thead><tr><th>Liderança</th><th>Contato</th><th>Equipe</th><th>Ativistas</th><th>Ação</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2>Nova liderança</h2><button class="close" onclick="closeModal()">×</button></div><form id="form"><div class="formgrid"><label>Nome completo<input required name="name"></label><label>Telefone<input name="phone"></label><label>E-mail<input type="email" name="email"></label><label>Equipe<input required name="team"></label><label class="full">Observação<input name="note"></label></div><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>
<script>
const KEY='team_registry_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'[]');
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function openModal(){document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('form').reset()}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);data.push({id:crypto.randomUUID(),name:f.get('name'),phone:f.get('phone'),email:f.get('email'),team:f.get('team'),note:f.get('note'),members:[]});save();closeModal()})
function render(){let q=document.getElementById('search').value.toLowerCase();let rows=document.getElementById('rows');let filtered=data.filter(x=>(x.name+' '+x.team+' '+x.email+' '+x.members.map(m=>m.name).join(' ')).toLowerCase().includes(q));rows.innerHTML=filtered.length?filtered.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(x.phone||'—')}<br><small>${esc(x.email||'')}</small></td><td><span class="tag">${esc(x.team)}</span></td><td>${x.members.length}</td><td><button class="btn secondary" onclick="addMember('${x.id}')">+ ativista</button></td></tr>`).join(''):`<tr><td colspan="5" class="empty">Nenhum cadastro encontrado.</td></tr>`;document.getElementById('mCoordinators').textContent=data.length;document.getElementById('mMembers').textContent=data.reduce((n,x)=>n+x.members.length,0);document.getElementById('mTeams').textContent=new Set(data.map(x=>x.team)).size}
function addMember(id){let x=data.find(a=>a.id===id);let name=prompt('Nome do ativista:');if(!name)return;let contact=prompt('Contato (opcional):')||'';x.members.push({name,contact});save()}
function exportCSV(){let out=[['Liderança','Telefone','Email','Equipe','Ativista','Contato']];data.forEach(x=>{if(!x.members.length)out.push([x.name,x.phone,x.email,x.team,'','']);else x.members.forEach(m=>out.push([x.name,x.phone,x.email,x.team,m.name,m.contact]))});let csv=out.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='cadastro-eleitoral.csv';a.click()}
function clearData(){if(confirm('Apagar todos os dados deste navegador?')){data=[];save()}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
render();
</script>
</body></html>
